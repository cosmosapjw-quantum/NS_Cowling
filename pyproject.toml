[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compose-cowling-pipeline"
version = "2.0.0"
description = "Fortran EOS core with Python frontend for CompOSE, TOV and relativistic Cowling modes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.7"]

[project.optional-dependencies]
test = ["pytest>=7", "mpmath>=1.3"]
plot = ["matplotlib>=3.6"]

[project.scripts]
compose-eos = "compose_eos.cli:main"
compose-cowling = "compose_cowling.cli:main"

[tool.setuptools]
package-dir = {"" = "python_frontend"}

[tool.setuptools.packages.find]
where = ["python_frontend"]
include = ["compose_eos*", "compose_cowling*"]

[tool.setuptools.data-files]
"share/compose-eos/fortran_eos" = ["fortran_eos/build.sh", "fortran_eos/run-generator.sh", "fortran_eos/run-nv-profile.sh", "fortran_eos/run-causal-audit.sh"]
"share/compose-eos/fortran_eos/src" = ["fortran_eos/src/*.f90"]
"share/compose-eos/fortran_eos/app" = ["fortran_eos/app/*.f90"]
"share/compose-eos/fortran_eos/vendor/slsqp" = ["fortran_eos/vendor/slsqp/slsqp_optmz.f", "fortran_eos/vendor/slsqp/SCIPY_LICENSE.txt", "fortran_eos/vendor/slsqp/PROVENANCE.json", "fortran_eos/vendor/slsqp/README.md"]
"share/compose-eos/oscillation_source/support/src" = ["oscillation_source/support/src/*.f90"]
"share/compose-eos/oscillation_source/solutions/src" = ["oscillation_source/solutions/src/*.f90"]
"share/compose-eos/oscillation_source/solutions/app" = ["oscillation_source/solutions/app/*.f90"]
"share/compose-eos/fortran_eos/vendor/odepack" = ["fortran_eos/vendor/odepack/*.f", "fortran_eos/vendor/odepack/PROVENANCE.md"]
"share/compose-eos/fortran_eos/tools" = ["fortran_eos/tools/cold_causal_endpoint_audit.f90"]
"share/compose-eos/data/eos_original_papers_20261123/research_nv" = ["data/eos_original_papers_20261123/research_nv/nv1973_original_source.dat"]
"share/compose-eos/oscillation_source/solutions/src/diagnostics" = ["oscillation_source/solutions/src/diagnostics/*.f90"]
"share/compose-eos/oscillation_source/solutions/src/eos" = ["oscillation_source/solutions/src/eos/*.f90"]
"share/compose-eos/oscillation_source/solutions/src/modes" = ["oscillation_source/solutions/src/modes/*.f90"]
"share/compose-eos/oscillation_source/solutions/src/numerics" = ["oscillation_source/solutions/src/numerics/*.f90"]
"share/compose-eos/oscillation_source/solutions/src/production" = ["oscillation_source/solutions/src/production/*.f90"]
"share/compose-eos/oscillation_source/solutions/src/structure" = ["oscillation_source/solutions/src/structure/*.f90"]
