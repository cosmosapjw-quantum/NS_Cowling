name: R16 minimal pressure-increment repair diagnostic

on:
  push:
    branches: [research/r15-native-outer-crust-pilot]
    paths:
      - ".github/workflows/r16-minimal-hermite-pressure-repair.yml"
      - "scripts/r16_minimal_hermite_pressure_repair.py"
      - "scripts/audit_r16_minimal_hermite_pressure_repair.py"
      - "python_frontend/tests/test_r16_minimal_hermite_pressure_repair.py"
      - "oscillation_release_v1/data/spectrum_summary_234.csv"
      - "oscillation_release_v1/data/eos_original_normalized/**"
      - "oscillation_release_v1/data/eos_projected/**"
      - "oscillation_source/methods/src/**"
      - "oscillation_source/methods/fpm.toml"
      - "oscillation_source/methods/app/r16_bridge_cell_audit.f90"
      - "oscillation_source/support/src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-admissible-pressure-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compiler, FPM and pytest
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gfortran curl
          python -m pip install pytest
          mkdir -p "${RUNNER_TEMP}/micromamba"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj -C "${RUNNER_TEMP}/micromamba" bin/micromamba
          "${RUNNER_TEMP}/micromamba/bin/micromamba" create -y -p "${RUNNER_TEMP}/fpm-env" -c conda-forge fpm
          echo "${RUNNER_TEMP}/fpm-env/bin" >> "${GITHUB_PATH}"
      - name: Test exact Hermite admissible pressure interval
        run: python -m pytest -q python_frontend/tests/test_r16_minimal_hermite_pressure_repair.py
      - name: Compare minimal SI-native pressure repair with current q-linear projector
        run: |
          python scripts/audit_r16_minimal_hermite_pressure_repair.py \
            --output-dir dist/r16-minimal-hermite-repair
      - name: Build the production Fortran bridge constructor
        working-directory: oscillation_source/methods
        run: |
          set -euo pipefail
          fpm --version | tee ../../dist/r16-fpm-version.txt
          fpm build --target r16_bridge_cell_audit --compiler gfortran --flag "-std=f2018 -O0 -g -fcheck=all -ffree-line-length-none -fimplicit-none" 2>&1 | tee ../../dist/r16-fortran-build.log
      - name: Run production Fortran constructor on every repaired SI cell
        working-directory: oscillation_source/methods
        run: |
          set -euo pipefail
          fpm run --target r16_bridge_cell_audit --compiler gfortran --flag "-std=f2018 -O0 -g -fcheck=all -ffree-line-length-none -fimplicit-none" -- ../../dist/r16-minimal-hermite-repair/r16_minimal_hermite_pressure_repair_fortran_cells.csv 2>&1 | tee ../../dist/r16-fortran-bridge-audit.log
          grep -F 'r16_fortran_cells_total=109776' ../../dist/r16-fortran-bridge-audit.log
          grep -F 'r16_fortran_cells_pass=109776' ../../dist/r16-fortran-bridge-audit.log
          grep -F 'r16_fortran_cells_fail=0' ../../dist/r16-fortran-bridge-audit.log
      - name: Upload diagnostic-only repair and compiled Fortran evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-cowling-r16-minimal-hermite-repair-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
