name: Fortran EOS frontend CI

on:
  push:
    branches:
      - main
      - research/fortran-eos-gap-fill-v1
      - research/eos390-fortran-unification-v1
      - cloud/eos390-fortran-unification-v1
  pull_request:
    branches:
      - main
      - research/fortran-eos-gap-fill-v1
      - research/eos390-fortran-unification-v1

permissions:
  contents: read

concurrency:
  group: fortran-eos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install native compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install Python package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Build Fortran EOS executable
        run: bash fortran_eos/build.sh build/compose_eos_fortran

      - name: Run frontend and direct-provider tests
        env:
          PYTHONPATH: python_frontend
          COMPOSE_EOS_FORTRAN_ROOT: .
          COMPOSE_EOS_FORTRAN_EXE: build/compose_eos_fortran/compose_eos_fortran
        run: python -m pytest -q python_frontend/tests pipeline/tests
      - name: Run native Fortran polynomial-extrema unit tests
        run: |
          gfortran -std=f2018 -O2 -ffree-line-length-none -fimplicit-none -fcheck=all \
            -Ibuild/compose_eos_fortran/mod \
            fortran_eos/tests/test_polynomial_extrema.f90 \
            build/compose_eos_fortran/obj/compose_eos_types.o \
            build/compose_eos_fortran/obj/compose_eos_reconstruct.o \
            -o build/compose_eos_fortran/test_polynomial_extrema
          build/compose_eos_fortran/test_polynomial_extrema

      - name: Run native Fortran CSS segment analytic tests
        run: |
          gfortran -std=f2018 -O2 -ffree-line-length-none -fimplicit-none -fcheck=all \
            -Ibuild/compose_eos_fortran/mod \
            fortran_eos/tests/test_css_segment.f90 \
            build/compose_eos_fortran/obj/compose_eos_types.o \
            build/compose_eos_fortran/obj/compose_eos_css.o \
            -o build/compose_eos_fortran/test_css_segment
          build/compose_eos_fortran/test_css_segment

      - name: Diagnose local-agent handoff document checkout bytes
        run: |
          git check-attr -a -- docs/EOS390_NATIVE_FORTRAN_LOCAL_AGENT_DAG_20261111.md
          git config --get core.autocrlf || true
          git config --get core.eol || true
          git hash-object docs/EOS390_NATIVE_FORTRAN_LOCAL_AGENT_DAG_20261111.md
          git rev-parse :docs/EOS390_NATIVE_FORTRAN_LOCAL_AGENT_DAG_20261111.md
          sha256sum docs/EOS390_NATIVE_FORTRAN_LOCAL_AGENT_DAG_20261111.md
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import subprocess
          name = "docs/EOS390_NATIVE_FORTRAN_LOCAL_AGENT_DAG_20261111.md"
          worktree = Path(name).read_bytes()
          blob = subprocess.check_output(["git", "show", f"HEAD:{name}"])
          for label, data in (("worktree", worktree), ("git_blob", blob)):
              print(f"{label}: bytes={len(data)} sha256={sha256(data).hexdigest()} "
                    f"CRLF={data.count(bytes([13, 10]))} CR={data.count(bytes([13]))} "
                    f"LF={data.count(bytes([10]))}")
          PY

      - name: Verify tracked SHA-256 manifest
        run: sha256sum -c SHA256SUMS_v4.txt

      - name: Package verified source snapshot
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=NS_Cowling-${GITHUB_SHA}/ HEAD > "dist/NS_Cowling-${GITHUB_SHA}.tar.gz"
          sha256sum "dist/NS_Cowling-${GITHUB_SHA}.tar.gz" > "dist/NS_Cowling-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload verified source package
        uses: actions/upload-artifact@v4
        with:
          name: NS_Cowling-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
