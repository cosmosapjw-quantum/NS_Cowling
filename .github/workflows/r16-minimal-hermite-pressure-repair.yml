name: R16 minimal pressure-increment repair diagnostic

on:
  push:
    branches: [research/r15-native-outer-crust-pilot]
    paths:
      - ".github/workflows/r16-minimal-hermite-pressure-repair.yml"
      - "scripts/r16_minimal_hermite_pressure_repair.py"
      - "scripts/audit_r16_minimal_hermite_pressure_repair.py"
      - "python_frontend/tests/test_r16_minimal_hermite_pressure_repair.py"
      - "oscillation_release_v1/data/spectrum_summary_234.csv"
      - "oscillation_release_v1/data/eos_original_normalized/**"
      - "oscillation_release_v1/data/eos_projected/**"
      - "oscillation_source/methods/src/eos/ns_mu_bridge.f90"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-admissible-pressure-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test exact Hermite admissible pressure interval
        run: python -m pytest -q python_frontend/tests/test_r16_minimal_hermite_pressure_repair.py
      - name: Compare minimal local pressure repair with current q-linear projector
        run: |
          python scripts/audit_r16_minimal_hermite_pressure_repair.py \
            --output-dir dist/r16-minimal-hermite-repair
      - name: Upload diagnostic-only repair comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-cowling-r16-minimal-hermite-repair-${{ github.run_id }}
          path: dist/r16-minimal-hermite-repair/
          if-no-files-found: error
          retention-days: 30
