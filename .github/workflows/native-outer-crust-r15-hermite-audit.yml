name: R15 native Hermite row-217-to-218 cell audit

on:
  push:
    branches: [research/r15-native-outer-crust-pilot]
    paths:
      - ".github/workflows/native-outer-crust-r15-hermite-audit.yml"
      - "scripts/r15_native_hermite_audit.py"
      - "scripts/audit_r15_native_hermite_boundary.py"
      - "python_frontend/tests/test_r15_native_hermite_audit.py"
      - "oscillation_release_v1/data/spectrum_summary_234.csv"
      - "oscillation_release_v1/data/eos_projected/**"
      - "oscillation_source/methods/src/eos/ns_mu_bridge.f90"
      - "oscillation_source/methods/src/eos/ns_cell_eos.f90"
      - "oscillation_source/methods/src/eos/ns_table_eos.f90"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-hermite-boundary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install numpy pytest
      - name: Test solver-native Hermite interval algebra
        run: python -m pytest -q python_frontend/tests/test_r15_native_hermite_audit.py
      - name: Audit row 217 to 218 in all 234 projected tables
        run: |
          python scripts/r15_native_hermite_audit.py \
            --output-dir dist/r15-native-hermite-row217-218
      - name: Upload whole-cell derivative and stationary-point evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-cowling-r15-native-hermite-row217-218-${{ github.run_id }}
          path: dist/r15-native-hermite-row217-218/
          if-no-files-found: error
          retention-days: 30
