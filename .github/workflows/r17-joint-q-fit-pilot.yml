name: R17 representative joint q-fit Pareto sensitivity pilot

on:
  push:
    branches: [research/r15-native-outer-crust-pilot]
    paths:
      - ".github/workflows/r17-joint-q-fit-pilot.yml"
      - "scripts/r17_joint_q_fit.py"
      - "scripts/run_r17_joint_q_fit_pilot.py"
      - "python_frontend/tests/test_r17_joint_q_fit.py"
      - "scripts/r16_projection_audit.py"
      - "oscillation_release_v1/data/spectrum_summary_234.csv"
      - "oscillation_release_v1/data/eos_original_normalized/**"
      - "oscillation_release_v1/data/eos_projected/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r17-joint-q-fit-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical/test dependencies
        run: python -m pip install numpy pytest
      - name: Test constrained joint-fit objective and invariants
        run: python -m pytest -q python_frontend/tests/test_r17_joint_q_fit.py
      - name: Run 4-table × 5-lambda Pareto pilot
        run: |
          python scripts/run_r17_joint_q_fit_pilot.py \
            --output-dir dist/r17-joint-q-fit-pilot \
            --max-iterations 50000 \
            --tolerance 1e-12
      - name: Upload R17 candidate/error-budget evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-cowling-r17-joint-q-fit-pilot-${{ github.run_id }}
          path: dist/r17-joint-q-fit-pilot/
          if-no-files-found: error
          retention-days: 30
