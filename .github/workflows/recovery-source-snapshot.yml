name: Recovery source snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create tracked-source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          archive="NS_Cowling-${sha}.tar.gz"
          git ls-files -z > /tmp/tracked-files.list
          tar --null --create --gzip --file="$archive" --files-from=/tmp/tracked-files.list
          sha256sum "$archive" > "$archive.sha256"
          printf 'revision=%s\n' "$sha" > snapshot-revision.txt
          printf 'archive=%s\n' "$archive" >> snapshot-revision.txt
          du -h "$archive"
          sha256sum -c "$archive.sha256"

      - name: Upload recoverable repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: NS_Cowling-source-${{ github.sha }}
          path: |
            NS_Cowling-${{ github.sha }}.tar.gz
            NS_Cowling-${{ github.sha }}.tar.gz.sha256
            snapshot-revision.txt
          if-no-files-found: error
          retention-days: 3
