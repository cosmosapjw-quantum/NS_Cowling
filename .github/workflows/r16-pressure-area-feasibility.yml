name: R16 causal pressure-area endpoint feasibility

on:
  push:
    branches: [research/r15-native-outer-crust-pilot]
    paths:
      - ".github/workflows/r16-pressure-area-feasibility.yml"
      - "scripts/r16_pressure_area_feasibility.py"
      - "python_frontend/tests/test_r16_pressure_area_feasibility.py"
      - "oscillation_release_v1/data/spectrum_summary_234.csv"
      - "oscillation_release_v1/data/eos_original_normalized/**"
      - "oscillation_release_v1/data/eos_projected/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pressure-area-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test the causal endpoint feasibility theorem
        run: python -m pytest -q python_frontend/tests/test_r16_pressure_area_feasibility.py
      - name: Audit all normalized and projected EOS cells
        run: |
          python scripts/r16_pressure_area_feasibility.py \
            --output-dir dist/r16-pressure-area-feasibility
      - name: Upload endpoint feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-cowling-r16-pressure-area-feasibility-${{ github.run_id }}
          path: dist/r16-pressure-area-feasibility/
          if-no-files-found: error
          retention-days: 30
