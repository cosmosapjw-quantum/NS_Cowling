name: R16 full-cohort isotonic pressure reconstruction audit

on:
  push:
    branches: [research/r15-native-outer-crust-pilot]
    paths:
      - ".github/workflows/r16-projection-audit.yml"
      - "scripts/r16_projection_audit.py"
      - "scripts/audit_r16_projection_cohort.py"
      - "scripts/audit_r16_pressure_increment_residuals.py"
      - "scripts/audit_r16_pressure_preserving_q_feasibility.py"
      - "scripts/build_r16_qexp_diagnostic_candidate.py"
      - "scripts/r16_pressure_preserving_q.py"
      - "python_frontend/tests/test_r16_pressure_preserving_q.py"
      - "python_frontend/tests/test_r16_projection_reconstruction.py"
      - "oscillation_release_v1/data/spectrum_summary_234.csv"
      - "oscillation_release_v1/data/eos_original_normalized/**"
      - "oscillation_release_v1/data/eos_projected/**"
      - "oscillation_release_v1/workflow/project_isotonic.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r16-projection-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test weighted isotonic and exact pressure integration
        run: python -m pytest -q python_frontend/tests/test_r16_projection_reconstruction.py
      - name: Test pressure-preserving monotone q interpolant
        run: python -m pytest -q python_frontend/tests/test_r16_pressure_preserving_q.py
      - name: Audit exact pressure-preserving q feasibility across all source cells
        run: |
          python scripts/audit_r16_pressure_preserving_q_feasibility.py \
            --output-dir dist/r16-pressure-preserving-q-feasibility
      - name: Build the full-cohort diagnostic q-exponential knot candidate
        run: |
          python scripts/build_r16_qexp_diagnostic_candidate.py \
            --output-dir dist/r16-qexp-diagnostic-candidate
      - name: Audit every native pressure-increment residual
        run: |
          python scripts/audit_r16_pressure_increment_residuals.py \
            --output-dir dist/r16-pressure-increment-residuals
      - name: Audit all 234 normalized-to-projected EOS pairs
        run: |
          python scripts/audit_r16_projection_cohort.py \
            --output-dir dist/r16-full-cohort-projection-audit
      - name: Upload R16 source-to-projection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-cowling-r16-projection-audit-${{ github.run_id }}
          path: dist/r16-full-cohort-projection-audit/
          if-no-files-found: error
          retention-days: 30
      - name: Upload cellwise pressure-increment residual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-cowling-r16-pressure-increment-${{ github.run_id }}
          path: dist/r16-pressure-increment-residuals/
          if-no-files-found: error
          retention-days: 30
      - name: Upload pressure-preserving q feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-cowling-r16-pressure-preserving-q-${{ github.run_id }}
          path: dist/r16-pressure-preserving-q-feasibility/
          if-no-files-found: error
          retention-days: 30
      - name: Upload the full-cohort q-exponential diagnostic candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-cowling-r16-qexp-diagnostic-candidate-${{ github.run_id }}
          path: dist/r16-qexp-diagnostic-candidate/
          if-no-files-found: error
          retention-days: 30
