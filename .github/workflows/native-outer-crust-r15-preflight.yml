name: R15 full-cohort native-density mesh preflight

on:
  push:
    branches: [research/r15-native-outer-crust-pilot]
    paths:
      - ".github/workflows/native-outer-crust-r15-preflight.yml"
      - "scripts/r15_native_density_preflight.py"
      - "python_frontend/compose_cowling/native_table_cutoff_scan.py"
      - "python_frontend/tests/test_native_density_cutoff_scan.py"
      - "python_frontend/tests/test_r15_native_density_preflight.py"
      - "python_frontend/tests/test_r15_cohort_selection.py"
      - "scripts/run_native_outer_crust_r15.py"
      - "oscillation_release_v1/data/spectrum_summary_234.csv"
      - "oscillation_release_v1/data/eos_projected/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-cohort-native-density-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: python_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python audit dependencies
        run: python -m pip install numpy scipy pytest
      - name: Test native density selector
        run: |
          python -m pytest -q python_frontend/tests/test_native_density_cutoff_scan.py
          python -m pytest -q python_frontend/tests/test_r15_native_density_preflight.py
          python -m pytest -q python_frontend/tests/test_r15_cohort_selection.py
      - name: Audit all 234 projected EOS tables without TOV integrations
        run: |
          python scripts/r15_native_density_preflight.py \
            --output-dir dist/native-outer-crust-r15-preflight \
            --target-count 8 \
            --maximum-density-fm3 1.0e-3
      - name: Upload full-cohort native-density preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-cowling-native-outer-crust-r15-preflight-${{ github.run_id }}
          path: dist/native-outer-crust-r15-preflight/
          if-no-files-found: warn
          retention-days: 30
