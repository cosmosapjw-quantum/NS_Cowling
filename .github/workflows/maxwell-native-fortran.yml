name: Native Fortran sharp Maxwell validation

on:
  push:
    branches:
      - research/maxwell-native-fortran-v1
    paths:
      - .github/workflows/maxwell-native-fortran.yml
      - oscillation_source/solutions/**
      - oscillation_source/support/**
      - python_frontend/compose_cowling/maxwell.py
      - python_frontend/compose_cowling/direct_barotrope.py
      - python_frontend/compose_eos/eos_data.py
      - scripts/validate_native_maxwell_reference.py
  pull_request:
    branches:
      - research/maxwell-reference-validation-v1
    paths:
      - .github/workflows/maxwell-native-fortran.yml
      - oscillation_source/solutions/**
      - oscillation_source/support/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxwell-native-fortran-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: research/maxwell-native-fortran-v1
          fetch-depth: 0

      - name: Install native compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran curl

      - name: Install Fortran Package Manager
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/micromamba"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj -C "${RUNNER_TEMP}/micromamba" bin/micromamba
          "${RUNNER_TEMP}/micromamba/bin/micromamba" create -y -p "${RUNNER_TEMP}/fpm-env" -c conda-forge fpm numpy scipy
          echo "${RUNNER_TEMP}/fpm-env/bin" >> "${GITHUB_PATH}"

      - name: Run native Fortran tests with runtime checks
        working-directory: oscillation_source/solutions
        run: |
          set -euo pipefail
          mkdir -p ../../dist
          fpm --version | tee ../../dist/fpm-version.txt
          fpm test --compiler gfortran --flag "-std=f2018 -O0 -g -fcheck=all -ffree-line-length-none -fimplicit-none" 2>&1 | tee ../../dist/maxwell-native-fpm-test.log

      - name: Build production case driver
        working-directory: oscillation_source/solutions
        run: |
          set -euo pipefail
          fpm build --compiler gfortran --flag "-std=f2018 -O0 -g -fcheck=all -ffree-line-length-none -fimplicit-none" 2>&1 | tee ../../dist/maxwell-native-fpm-build.log

      - name: Exercise normalized-table production case driver
        working-directory: oscillation_source/solutions
        run: |
          set -euo pipefail
          fpm run --target case_driver -- maxwell_table_cowling ../../dist/maxwell_table_fixture.nml 2>&1 | tee ../../dist/maxwell-table-cli.log
          grep -E '^result_valid[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-table-cli.log
          grep -E '^cowling_shot_valid[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-table-cli.log
          fpm run --target case_driver -- maxwell_table_spectrum ../../dist/maxwell_table_fixture.nml 2>&1 | tee ../../dist/maxwell-spectrum-cli.log
          grep -E '^spectrum_scan_valid[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-spectrum-cli.log
          grep -E '^spectrum_all_trials_succeeded[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-spectrum-cli.log
          grep -E '^spectrum_valid[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-spectrum-cli.log
          grep -E '^spectrum_roots_found[[:space:]]+int[[:space:]]+2$' ../../dist/maxwell-spectrum-cli.log
          grep -E '^spectrum_root_valid_00001[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-spectrum-cli.log
          grep -E '^spectrum_root_valid_00002[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-spectrum-cli.log
          fpm run --target case_driver -- maxwell_table_spectrum ../../dist/maxwell_table_rapid_fixture.nml 2>&1 | tee ../../dist/maxwell-rapid-spectrum-cli.log
          grep -E '^spectrum_scan_valid[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-rapid-spectrum-cli.log
          grep -E '^spectrum_all_trials_succeeded[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-rapid-spectrum-cli.log
          grep -E '^spectrum_valid[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-rapid-spectrum-cli.log
          grep -E '^spectrum_roots_found[[:space:]]+int[[:space:]]+2$' ../../dist/maxwell-rapid-spectrum-cli.log
          grep -E '^spectrum_root_valid_00001[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-rapid-spectrum-cli.log
          grep -E '^spectrum_root_valid_00002[[:space:]]+bool[[:space:]]+true$' ../../dist/maxwell-rapid-spectrum-cli.log
          run_spectrum_case() {
            local nml="$1"
            local log="$2"
            fpm run --target case_driver -- maxwell_table_spectrum "../../dist/${nml}" 2>&1 | tee "../../dist/${log}"
            grep -E '^spectrum_scan_valid[[:space:]]+bool[[:space:]]+true$' "../../dist/${log}"
            grep -E '^spectrum_all_trials_succeeded[[:space:]]+bool[[:space:]]+true$' "../../dist/${log}"
            grep -E '^spectrum_valid[[:space:]]+bool[[:space:]]+true$' "../../dist/${log}"
            grep -E '^spectrum_roots_found[[:space:]]+int[[:space:]]+2$' "../../dist/${log}"
            grep -E '^spectrum_root_valid_00001[[:space:]]+bool[[:space:]]+true$' "../../dist/${log}"
            grep -E '^spectrum_root_valid_00002[[:space:]]+bool[[:space:]]+true$' "../../dist/${log}"
          }
          run_spectrum_case maxwell_table_slow_ode_tight.nml maxwell-spectrum-slow-ode-tight.log
          run_spectrum_case maxwell_table_rapid_ode_tight.nml maxwell-spectrum-rapid-ode-tight.log
          run_spectrum_case maxwell_table_slow_root_grid_tight.nml maxwell-spectrum-slow-root-grid-tight.log
          run_spectrum_case maxwell_table_rapid_root_grid_tight.nml maxwell-spectrum-rapid-root-grid-tight.log
          python ../../scripts/validate_native_maxwell_reference.py \
            --slow-log ../../dist/maxwell-spectrum-cli.log \
            --rapid-log ../../dist/maxwell-rapid-spectrum-cli.log \
            --slow-ode-tight-log ../../dist/maxwell-spectrum-slow-ode-tight.log \
            --rapid-ode-tight-log ../../dist/maxwell-spectrum-rapid-ode-tight.log \
            --slow-root-grid-tight-log ../../dist/maxwell-spectrum-slow-root-grid-tight.log \
            --rapid-root-grid-tight-log ../../dist/maxwell-spectrum-rapid-root-grid-tight.log \
            --output ../../dist/maxwell-native-convergence-reference.json

      - name: Record exact source identity
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee dist/VERIFIED_HEAD.txt
          sha256sum \
            oscillation_source/solutions/src/structure/ns_maxwell_tov.f90 \
            oscillation_source/solutions/src/modes/ns_maxwell_cowling.f90 \
            oscillation_source/solutions/src/structure/ns_maxwell_cases.f90 \
            oscillation_source/solutions/src/production/ns_production_solvers.f90 \
            oscillation_source/solutions/src/modes/ns_maxwell_mode_spectrum.f90 \
            oscillation_source/solutions/src/modes/ns_mode_cases.f90 \
            oscillation_source/solutions/src/structure/ns_tov_cases.f90 \
            oscillation_source/solutions/src/structure/ns_table_star_cases.f90 \
            oscillation_source/solutions/tests_fortran/maxwell_checks.f90 \
            oscillation_source/solutions/tests_fortran/maxwell_table_checks.f90 \
            oscillation_source/solutions/fpm.toml \
            python_frontend/compose_cowling/maxwell.py \
            python_frontend/compose_cowling/direct_barotrope.py \
            python_frontend/compose_eos/eos_data.py \
            scripts/validate_native_maxwell_reference.py \
            > dist/MAXWELL_NATIVE_FORTRAN_SHA256SUMS.txt

      - name: Upload exact-head validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxwell-native-fortran-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30